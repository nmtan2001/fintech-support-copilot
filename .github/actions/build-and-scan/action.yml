name: Build and scan application image
inputs:
  hf-token:
    description: Read-only token for the private inference checkpoint.
    required: true
description: Build the API image and fail on high or critical vulnerabilities.
outputs:
  image:
    description: Lowercase GHCR image name.
    value: ${{ steps.metadata.outputs.image }}
  tag:
    description: Commit-SHA or semantic release image tag.
    value: ${{ steps.metadata.outputs.tag }}
  app-version:
    description: Application version baked into the image.
    value: ${{ steps.metadata.outputs.app_version }}
runs:
  using: composite
  steps:
    - name: Select image name and immutable tag
      id: metadata
      shell: bash
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        version="$(cat VERSION)"
        project_version="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' pyproject.toml | head -n 1)"
        if [[ "$project_version" != "$version" ]]; then
          echo "VERSION ($version) does not match pyproject.toml ($project_version)." >&2
          exit 1
        fi
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi
          image_tag="$GITHUB_REF_NAME"
        else
          image_tag="sha-${GITHUB_SHA:0:12}"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
        echo "app_version=$version" >> "$GITHUB_OUTPUT"

    - name: Build container image
      shell: bash
      env:
        APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        IMAGE_NAME: ${{ steps.metadata.outputs.image }}
        IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
      run: docker build --build-arg "APP_VERSION=$APP_VERSION" --build-arg "APP_COMMIT=$GITHUB_SHA" --tag "$IMAGE_NAME:$IMAGE_TAG" .

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
        version: v0.76.2
        format: table
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    - name: Verify running release container
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.metadata.outputs.image }}
        IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        HF_TOKEN: ${{ inputs.hf-token }}
      run: |
        set -euo pipefail
        if [[ -z "$HF_TOKEN" ]]; then
          echo "HF_TOKEN is required to test the private checkpoint." >&2
          exit 1
        fi
        export HF_MODEL_REVISION=22b8cf5377501f09520f8655d2cd42096c23cf3f
        container_id=$(docker run -d -e HF_TOKEN -e HF_MODEL_REVISION -p 127.0.0.1:18001:8000 "$IMAGE_NAME:$IMAGE_TAG")
        cleanup() {
          docker cp "$container_id:/tmp/model-evaluation.json" model-evaluation.json 2>/dev/null || true
          docker logs "$container_id"
          docker rm -f "$container_id" >/dev/null
        }
        trap cleanup EXIT
        python3 scripts/verify_release.py --url http://127.0.0.1:18001 \
          --version "$APP_VERSION" --commit "$GITHUB_SHA" --wait-seconds 600
        python3 scripts/load_test.py --url http://127.0.0.1:18001 --requests 20 --concurrency 2 > load-test.json
        docker exec "$container_id" python -m scripts.evaluate_release
        docker cp "$container_id:/tmp/model-evaluation.json" model-evaluation.json

    - name: Retain model evaluation evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: model-evaluation
        path: model-evaluation.json
        if-no-files-found: warn

    - name: Retain load measurement
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: synthetic-load-test
        path: load-test.json
        if-no-files-found: warn

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.76.2
        image-ref: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
        format: cyclonedx
        output: sbom.cdx.json

    - name: Retain SBOM
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: container-sbom
        path: sbom.cdx.json

    - name: Create disposable Kubernetes cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        cluster_name: copilot-ci
        version: v0.30.0
        kubectl_version: v1.34.0
        node_image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a

    - name: Verify Kubernetes rollout and recovery
      shell: bash
      env:
        IMAGE: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
        APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        APP_COMMIT: ${{ github.sha }}
        HF_TOKEN: ${{ inputs.hf-token }}
      run: |
        kind load docker-image "$IMAGE" --name copilot-ci
        bash scripts/cluster_smoke.sh

    - name: Inspect Kubernetes failure
      if: failure()
      shell: bash
      run: |
        kubectl get pods -n fintech-support -o wide || true
        kubectl describe pods -n fintech-support || true
        kubectl logs -n fintech-support -l app.kubernetes.io/name=fintech-support-copilot --tail=100 || true

    - name: Delete disposable Kubernetes cluster
      if: always()
      shell: bash
      run: kind delete cluster --name copilot-ci
