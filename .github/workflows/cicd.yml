name: CI and Kubernetes delivery

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}

jobs:
  validate:
    name: Tests and code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install application and development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e ".[api,dev]"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run Ruff checks
        run: python -m ruff check api.py app.py fintech_support scripts tests/test_api_http.py tests/test_release_verification.py tests/test_deployment.py tests/test_credentials.py

  container-check:
    name: Container build and scan
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and scan image
        uses: ./.github/actions/build-and-scan
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

  publish:
    name: Publish versioned image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      version: ${{ steps.image.outputs.app-version }}
      digest: ${{ steps.published.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and scan release image
        id: image
        uses: ./.github/actions/build-and-scan
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        id: published
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$IMAGE_TAG")
          echo "digest=$reference" >> "$GITHUB_OUTPUT"
          if [[ "$IMAGE_TAG" == v* ]]; then
            commit_tag="sha-${GITHUB_SHA:0:12}"
            docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$commit_tag"
            docker push "$IMAGE_NAME:$commit_tag"
          fi

  deploy:
    name: Deploy and verify Kubernetes rollout
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    concurrency:
      group: kubernetes-demo-deployment
      cancel-in-progress: false
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: kubernetes-demo
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      IMAGE_NAME: ${{ needs.publish.outputs.image }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject stale or unauthorized releases
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Only the current main commit may deploy. This release is stale or outside main." >&2
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.34.0' }}

      - name: Configure cluster access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KUBECONFIG_CONTENT" ]]; then
            echo "Set KUBECONFIG_CONTENT in the kubernetes-demo environment." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Create or update private registry pull secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_READ_TOKEN" ]]; then
            echo "Set GHCR_USERNAME and GHCR_READ_TOKEN in the kubernetes-demo environment." >&2
            exit 1
          fi
          kubectl create secret generic fintech-support-copilot \
            --namespace fintech-support --from-literal=HF_TOKEN="$HF_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace fintech-support \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_READ_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy digest, verify and recover on failure
        run: |
          python3 -m scripts.deploy --image "$IMAGE_DIGEST" \
            --version "$EXPECTED_VERSION" --commit "$GITHUB_SHA"

      - name: Retain release identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity
          path: release-evidence.json
          if-no-files-found: error

      - name: Collect rollout diagnostics
        if: failure()
        run: |
          kubectl get pods -n fintech-support -o wide || true
          kubectl describe deployment fintech-support-copilot -n fintech-support || true
          kubectl get events -n fintech-support --sort-by=.lastTimestamp || true
          kubectl logs -n fintech-support -l app.kubernetes.io/name=fintech-support-copilot \
            --all-containers --tail=100 --prefix || true

      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kube/config"
