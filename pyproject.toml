[project]
name = "fintech-support-copilot"
version = "0.1.0"
description = "BANKING77 intent classifier with a classical baseline and DistilBERT"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2",
    "pandas>=2,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
training = [
    "accelerate>=1,<2",
    "datasets>=3.6,<5",
    "torch>=2.2,<3",
    "transformers==4.57.1",
]
dev = ["pytest>=8,<10"]
demo = ["streamlit>=1.30,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
semantic = ["sentence-transformers>=3,<6"]
inference = ["torch>=2.2,<3", "transformers==4.57.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
