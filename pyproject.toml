[project]
name = "fintech-support-copilot"
version = "1.2.0"
description = "BANKING77 intent classifier with a classical baseline and DistilBERT"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2",
    "pandas>=2,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
training = [
    "accelerate>=1,<2",
    "datasets>=3.6,<5",
    "torch>=2.2,<3",
    "transformers==5.23.0",
]
dev = ["pytest>=8,<10", "ruff==0.14.9", "httpx>=0.27,<1"]
demo = ["streamlit>=1.62,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1"]
semantic = ["sentence-transformers==5.2.3"]
inference = ["torch>=2.2,<3", "transformers==5.23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=78.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintech_support*"]
