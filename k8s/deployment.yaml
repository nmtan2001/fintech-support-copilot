apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-support-copilot
  namespace: fintech-support
  labels:
    app.kubernetes.io/name: fintech-support-copilot
spec:
  replicas: 2
  # Private-model cold starts can precede sequential surge replicas.
  progressDeadlineSeconds: 1800
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fintech-support-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fintech-support-copilot
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          # The delivery workflow replaces this with the scanned release image.
          image: ghcr.io/nmtan2001/fintech-support-copilot:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fintech-support-copilot
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fintech-support-copilot
                  key: HF_TOKEN
                  optional: true
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fintech-support-copilot
                  key: ZAI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 2Gi
